[package]
name = "rust_renode_rtos"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"]}
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.3.3"
nrf52840-hal = "0.18"
#stm32f1xx-hal = { version = "0.10.0",features = ["rt","stm32f103"]}
rtic = {package = "cortex-m-rtic", version = "1.1.4"}
heapless = "0.8"
panic-halt = "0.2"
ufmt = "0.2.0"
libm = "0.2.16"


[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
